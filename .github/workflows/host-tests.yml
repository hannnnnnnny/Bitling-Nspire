name: Lua host validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/test.py
      - run: python tools/build.py
